# Local development services for Shadows of the Shogun (spec §114 dev tier).
version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: shogun-postgres
    environment:
      POSTGRES_USER: shogun
      POSTGRES_PASSWORD: shogun
      POSTGRES_DB: shogun
    ports:
      - "5432:5432"
    volumes:
      - shogun-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shogun"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shogun-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: shogun-backend
    working_dir: /app
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://shogun:shogun@postgres:5432/shogun
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_change_in_production
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npm run prisma:migrate && npm run start:dev"

  admin-panel:
    build:
      context: ./admin-panel
    container_name: shogun-admin-panel
    working_dir: /app
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./admin-panel:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  shogun-pg:
