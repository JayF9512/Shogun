# Shadows of the Shogun — web client
# Public URL: https://shogun-play.abacusai.cloud  ->  server_name shogun-play.vm.internal
server {
    listen 80;
    server_name shogun-play.vm.internal;

    root /home/ubuntu/shogun-web;
    index index.html;

    # HTML always revalidated; edge caches briefly. Static assets carry ?v= query.
    add_header Cache-Control "max-age=0, s-maxage=60";

    # Long-cache immutable media (content-addressed via ?v= on JS/CSS)
    location ~* \.(webp|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
